plugins {
    id "com.android.application"
}

android {
    namespace "com.yiddish24.latest"
    compileSdk 34

    defaultConfig {
        applicationId "com.yiddish24.latest"
        minSdk 24
        targetSdk 30
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
